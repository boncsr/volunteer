<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>본그룹 노을공원 나무심기 봉사활동 빙고</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Press+Start+2P&display=swap">
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one phone-width game column — pixel sunset scene, HUD, 3x3 mission board, gift counter. Single committed daytime-arcade look. */
:root {
  --sky: #9ED8F5;
  --sun: #FF8A3D;
  --grass: #5DBB4A;
  --grass-dk: #2F7D32;
  --ink: #2B1D12;
  --paper: #FFF8E6;
  --paper-2: #FBEBC4;
  --gold: #FFD23F;
  --leaf: #E0581F;
  --quiz: #2F62C9;
  --muted: #6B5644;
  --white: #FFFFFF;
  --f-display: "Black Han Sans", "Jua", system-ui, sans-serif;
  --f-body: "Jua", system-ui, sans-serif;
  --f-pixel: "Press Start 2P", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--grass); }
body {
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.wrap {
  max-width: 540px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* pixel panel */
.panel {
  background: var(--paper);
  border: 4px solid var(--ink);
  box-shadow: 5px 5px 0 var(--ink);
  padding: 16px;
}
.pixel-label { font-family: var(--f-pixel); font-size: 10px; letter-spacing: 1px; }

/* scene */
.scene { position: relative; margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
.scene canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; }
.hud {
  position: absolute; inset: 10px max(16px, env(safe-area-inset-right, 0px)) auto max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.chip {
  background: var(--ink); color: var(--white);
  font-family: var(--f-pixel); font-size: 9px; padding: 7px 8px; line-height: 1;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip b { color: var(--gold); font-weight: 400; }
.title-block {
  position: absolute; left: 0; right: 0; top: 34px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  padding-inline: 16px;
}
.kicker { font-family: var(--f-body); color: var(--ink); background: var(--gold); border: 3px solid var(--ink); padding: 2px 10px; font-size: 15px; }
h1 {
  margin: 0;
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(34px, 10vw, 52px); line-height: 1.05;
  color: var(--white);
  text-shadow: 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink), 3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 3px -3px 0 var(--ink), -3px -3px 0 var(--ink), 0 7px 0 var(--ink);
  text-wrap: balance;
}
h1 .hl { color: var(--gold); }

/* start form */
.start h2, .section-title {
  margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; display: flex; align-items: center; gap: 10px;
}
.start form { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  border: 4px solid var(--ink); background: var(--white); padding: 12px 10px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 19px;
  box-shadow: 3px 3px 0 var(--ink); cursor: pointer;
}
.seg label small { font-size: 13px; color: var(--muted); }
.seg input:checked + label { background: var(--gold); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.seg input:focus-visible + label { outline: 3px solid var(--quiz); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 16px; }
.input {
  width: 100%; border: 4px solid var(--ink); background: var(--white); padding: 11px 12px; font-size: 18px; border-radius: 0;
}
textarea.input { resize: vertical; min-height: 110px; }
.btn {
  border: 4px solid var(--ink); background: var(--gold); padding: 13px 16px; font-size: 20px;
  box-shadow: 4px 4px 0 var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 10px;
}
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { background: #D9CBB2; color: var(--muted); cursor: not-allowed; }
.btn.green { background: var(--grass); color: var(--white); text-shadow: 2px 2px 0 var(--ink); }
.btn.blue { background: var(--quiz); color: var(--white); text-shadow: 2px 2px 0 var(--ink); }
.btn.ghost { background: var(--white); }
.btn.block { width: 100%; }
.error { color: #B3261E; font-size: 15px; min-height: 1.2em; margin: 0; }

/* player bar */
.player { display: flex; flex-direction: column; gap: 10px; }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.names .field { min-width: 0; }
.names label small { font-size: 13px; color: var(--muted); }
.names .input { font-size: 17px; padding: 10px; }
.names .input:disabled { background: var(--paper-2); color: var(--ink); }
@media (max-width: 420px) { .names { grid-template-columns: minmax(0, 1fr); } }
.player.need .names .input#pname { border-color: #B3261E; box-shadow: 0 0 0 3px #F6C8C3; }
.player .error:empty { display: none; }
.tag { font-family: var(--f-pixel); font-size: 9px; background: var(--ink); color: var(--gold); padding: 6px 7px; align-self: flex-start; }
.meter { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.meter-row { display: flex; justify-content: space-between; font-size: 15px; }
.sync { margin: 0; font-size: 14px; color: var(--grass-dk); min-height: 1.2em; }
.sync:empty { display: none; }
.sync.busy { color: var(--muted); }
.sync.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--leaf); margin-right: 6px; vertical-align: 1px; animation: blink 1s steps(2) infinite; }
.sync.bad { color: #B3261E; }
@keyframes blink { 50% { opacity: 0; } }
.bar { height: 18px; border: 3px solid var(--ink); background: var(--white); display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 2px; padding: 2px; }
.bar i { background: var(--paper-2); }
.bar i.on { background: var(--grass); }

/* board */
.board-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.board-head p { margin: 0; color: var(--ink); font-size: 15px; }
.board {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  background: var(--ink); padding: 8px; border: 4px solid var(--ink); box-shadow: 5px 5px 0 rgba(43,29,18,.45);
}
.tile {
  position: relative; aspect-ratio: 1 / 1.08; max-width: 100%;
  border: 0; background: var(--paper); padding: 8px 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
  min-width: 0;
}
.tile .num { position: absolute; top: 6px; left: 6px; font-family: var(--f-pixel); font-size: 8px; color: var(--muted); }
.tile svg { width: 38%; height: auto; }
.tile .name { font-size: clamp(13px, 3.6vw, 16px); line-height: 1.2; word-break: keep-all; }
.tile.center { background: #FFE6CF; }
.tile:hover:not(:disabled) { background: var(--white); }
.tile.done { background: var(--grass); color: var(--white); }
.tile.done .num { color: var(--ink); }
.tile.done .name { text-shadow: 1px 1px 0 var(--ink); }
.tile .stamp {
  position: absolute; top: 4px; right: 4px; background: var(--gold); color: var(--ink);
  font-family: var(--f-pixel); font-size: 7px; padding: 4px 4px; border: 2px solid var(--ink);
}
.tile.inline { box-shadow: inset 0 0 0 4px var(--gold); }
.tile.pop { animation: pop .45s steps(4); }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border: 2px solid var(--ink); display: inline-block; }

/* gift */
.gift { display: flex; flex-direction: column; gap: 12px; }
.tiers { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choices input { position: absolute; opacity: 0; pointer-events: none; }
.choices label { border: 4px solid var(--ink); background: var(--white); padding: 14px 16px; font-size: 19px; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; display: flex; align-items: center; gap: 12px; }
.choices label::before { content: ""; width: 20px; height: 20px; border: 3px solid var(--ink); background: var(--white); flex-shrink: 0; }
.choices input:checked + label { background: var(--gold); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.choices input:checked + label::before { background: var(--grass); box-shadow: inset 0 0 0 3px var(--white); }
.choices input:focus-visible + label { outline: 3px solid var(--quiz); outline-offset: 2px; }
.ideas { display: flex; flex-wrap: wrap; gap: 8px; }
.idea { border: 3px solid var(--ink); background: var(--white); padding: 8px 12px; font-size: 16px; min-height: 44px; }
.idea.on { background: var(--gold); }
.review-box { min-height: 150px; }
.counter { align-self: flex-end; font-size: 14px; color: var(--muted); }
.counter.ok { color: var(--grass-dk); }
.tier { border: 3px solid var(--ink); background: var(--white); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
.tier .pixel-label { color: var(--muted); }
.tier strong { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.tier small { font-size: 14px; color: var(--muted); }
.tier.ready { background: #FFF2B8; }
.tier.got { background: var(--grass); color: var(--white); }
.tier.got .pixel-label, .tier.got small { color: var(--white); }

.foot { display: flex; justify-content: center; }
.linkish { background: none; border: 0; text-decoration: underline; color: var(--ink); font-size: 14px; padding: 8px; }

/* sheet */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(43,29,18,.55);
  display: flex; align-items: flex-end; justify-content: center;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
}
.sheet {
  width: 100%; max-width: 540px; max-height: 92%; overflow-y: auto;
  background: var(--paper); border: 4px solid var(--ink); border-bottom: 0;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
  animation: up .25s steps(5);
}
@keyframes up { from { transform: translateY(40px); } to { transform: none; } }
.sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sheet-top .pixel-label { color: var(--leaf); }
.sheet h3 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.2; text-wrap: balance; word-break: keep-all; }
.sheet .desc { margin: 0; color: var(--muted); font-size: 16px; }
.close { border: 3px solid var(--ink); background: var(--white); width: 44px; height: 44px; flex-shrink: 0; font-family: var(--f-pixel); font-size: 12px; }
.hint { background: var(--white); border: 3px dashed var(--ink); padding: 10px 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint .jamo { font-family: var(--f-display); font-size: 26px; letter-spacing: 6px; color: var(--leaf); }
.answer-row { display: flex; align-items: center; gap: 10px; }
.answer-row .input { flex: 1; min-width: 0; }
.answer-row .unit { font-size: 20px; flex-shrink: 0; }
.feedback { margin: 0; font-family: var(--f-display); font-size: 22px; min-height: 1.3em; }
.feedback.bad { color: #B3261E; }
.feedback.good { color: var(--grass-dk); }
.shake { animation: shake .35s steps(6); }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-4px); } }
.photo-drop {
  border: 4px dashed var(--ink); background: var(--white); min-height: 170px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px; text-align: center; cursor: pointer;
}
.photo-drop img { max-height: 260px; width: auto; border: 3px solid var(--ink); }
.photo-drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.note { font-size: 14px; color: var(--muted); margin: 0; }

/* reward */
.reward { align-items: stretch; }
.ticket { border: 4px solid var(--ink); background: var(--white); padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.ticket .big { font-family: var(--f-display); font-size: 30px; line-height: 1.15; }
.ticket .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.ticket .done-stamp { border: 4px solid var(--leaf); color: var(--leaf); font-family: var(--f-display); font-size: 24px; padding: 4px 14px; transform: rotate(-6deg); }
.staff { border-top: 4px dashed var(--ink); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.staff .pin { letter-spacing: 10px; text-align: center; font-family: var(--f-pixel); font-size: 18px; }

/* toast + confetti */
.toast {
  position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30;
  background: var(--gold); border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
  padding: 10px 18px; font-family: var(--f-display); font-size: 24px; white-space: nowrap;
}
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 25; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 10px; animation: fall 1.4s steps(14) forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(180deg); } }
@media (prefers-reduced-motion: reduce) {
  .tile.pop, .sheet, .shake, .confetti i { animation: none !important; }
  .confetti { display: none; }
}
.busy { position: fixed; inset: 0; z-index: 40; background: rgba(43,29,18,.45); display: flex; align-items: center; justify-content: center; }
.busy span { background: var(--paper); border: 4px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 14px 20px; font-family: var(--f-display); font-size: 22px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="scene">
    <canvas id="scene" width="180" height="96" aria-hidden="true"></canvas>
    <div class="hud">
      <span class="chip">STAGE <b>노을공원</b></span>
      <span class="chip">SCORE <b id="score">0000</b></span>
    </div>
    <div class="title-block">
      <span class="kicker">본그룹</span>
      <h1>노을공원 나무심기<br><span class="hl">봉사활동 빙고</span></h1>
    </div>
  </div>

  <div id="game" style="display: flex; flex-direction: column; gap: 18px">
    <section class="panel player" id="playerPanel">
      <div class="names">
        <div class="field">
          <label for="pname">내 이름</label>
          <input class="input" id="pname" autocomplete="off" maxlength="20" placeholder="예: 김봉사">
        </div>
        <div class="field">
          <label for="pfamily">자녀 이름 <small>(함께 왔다면)</small></label>
          <input class="input" id="pfamily" autocomplete="off" maxlength="60" placeholder="예: 김나무, 김숲">
        </div>
      </div>
      <p class="error" id="nameErr" aria-live="polite"></p>
      <div class="meter">
        <div class="meter-row"><span>미션 <b id="doneCount">0</b> / 9</span><span>빙고 <b id="lineCount">0</b>줄</span></div>
        <div class="bar" id="bar" aria-hidden="true"></div>
        <p class="sync" id="syncState" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div class="board-head">
        <h2 class="section-title" style="color: var(--white); text-shadow: 2px 2px 0 var(--ink)">미션 보드</h2>
        <p>칸을 눌러 미션 도전</p>
      </div>
      <div class="board" id="board"></div>
      <div class="legend">
        <span><i style="background: var(--grass)"></i>완료</span>
        <span><i style="background: var(--paper); box-shadow: inset 0 0 0 3px var(--gold)"></i>빙고 줄</span>
        <span><i style="background: #FFE6CF"></i>핵심 미션</span>
      </div>
    </section>

    <section class="panel gift">
      <h2 class="section-title">선물 교환소</h2>
      <div class="tiers" id="tiers"></div>
      <button class="btn blue block" id="giftBtn" type="button">선물 교환하기</button>
      <p class="note" id="giftNote"></p>
    </section>
  </div>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toastHost"></div>

<script>
(function () {
  // 스태프 번호는 서버(Code.gs)의 CONFIG.STAFF_PIN 에서 바꿔요.
  var STORE_KEY = 'bon-noeul-bingo-v2';

  // ===== 서버 호출 =====
  // ▼ Apps Script 웹 앱 URL(…/exec)을 여기에 붙여 넣으세요
  var API_URL = 'https://script.google.com/macros/s/AKfycbzD12nxPsHNY0wYdzNOUhQcinDJ8Zr8mg3aoA1_aeg0IDjyKz2zPSrmZwDRK9Rvnut3bw/exec';

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) {
      return Promise.reject(new Error('서버 주소가 아직 설정되지 않았어요. 스태프에게 알려 주세요.'));
    }
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: fn, args: args }),
      redirect: 'follow'
    }).then(function (r) {
      if (!r.ok) { var he = new Error('HTTP ' + r.status); he.server = true; throw he; }
      return r.json();
    }).then(function (j) {
      if (!j || !j.ok) { var se = new Error((j && j.error) || '알 수 없는 오류'); se.server = true; throw se; }
      return j.data;
    });
  }
  function errMsg(e) {
    var m = (e && e.message) || '';
    if (/Exception:\s*/.test(m)) m = m.replace(/^.*Exception:\s*/, '');
    if (m && /[가-힣]/.test(m) && !/Error|Exception/.test(m)) return m;
    if (e && e.server) return '저장하지 못했어요. 스태프에게 이 문구를 보여 주세요. (서버: ' + m.slice(0, 160) + ')';
    if (e && e.name === 'SyntaxError') return '저장하지 못했어요. 스태프에게 알려 주세요. (서버 응답 형식 오류)';
    return '저장하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
  }
  var busyEl = null;
  function busy(on, text) {
    if (on) {
      if (!busyEl) { busyEl = document.createElement('div'); busyEl.className = 'busy'; busyEl.setAttribute('role', 'status'); busyEl.innerHTML = '<span></span>'; document.body.appendChild(busyEl); }
      busyEl.firstChild.textContent = text || '저장 중...';
    } else if (busyEl) { busyEl.remove(); busyEl = null; }
  }
  function applyServer(st) {
    if (!st) return;
    var d = Object.assign({}, st.done || {});
    (S.pending || []).forEach(function (j) { if (!j.photo) d[j.mid] = true; });
    S.done = d;
    S.gift = st.gift || null;
    if (st.id) S.id = st.id;
    save();
  }

  // 보기 문구는 서버(Code.gs)의 REJOIN_OPTIONS 와 똑같아야 해요
  var REJOIN_OPTIONS = ['꼭 다시 참여할래요', '일정이 맞으면 참여할래요', '아직 잘 모르겠어요'];
  var IDEA_EXAMPLES = ['보물찾기', '줍깅', '숲 해설 탐방', '곤충·새 관찰', '새집 달기', '가족 피크닉'];
  var REVIEW_MIN_CHARS = 40;

  // ===== 배경 =====
  function drawScene() {
    var c = $('scene'), x = c.getContext('2d'), W = c.width, H = c.height;
    var bands = ['#9ED8F5', '#B5E0F2', '#FFD9A8', '#FFC27A', '#FFA65C'];
    for (var i = 0; i < bands.length; i++) { x.fillStyle = bands[i]; x.fillRect(0, i * 12, W, 12); }
    x.fillStyle = '#FF8A3D';
    for (var r = 14; r >= 0; r--) { var w = Math.round(Math.sqrt(14 * 14 - r * r)); x.fillRect(140 - w, 60 - r, w * 2, 1); }
    x.fillStyle = '#FFE08A'; x.fillRect(130, 50, 4, 2); x.fillRect(146, 52, 3, 2);
    x.fillStyle = '#FFFFFF'; [[18, 50, 14], [64, 46, 10]].forEach(function (cl) { x.fillRect(cl[0], cl[1], cl[2], 3); x.fillRect(cl[0] + 3, cl[1] - 2, cl[2] - 6, 2); });
    // hill (the park mountain)
    x.fillStyle = '#7CC95E';
    for (var px = 0; px < W; px++) { var h = 70 - Math.round(12 * Math.exp(-Math.pow((px - 70) / 45, 2))); x.fillRect(px, h, 1, H - h); }
    x.fillStyle = '#5DBB4A'; x.fillRect(0, 80, W, H - 80);
    x.fillStyle = '#4FA83E'; for (var gx = 0; gx < W; gx += 6) x.fillRect(gx, 80, 3, 1);
    // autumn trees
    var cols = ['#E0581F', '#F2A93B', '#C7362B', '#FFD23F', '#2F7D32', '#E0581F', '#F2A93B'];
    var spots = [8, 24, 38, 100, 116, 160, 174];
    spots.forEach(function (tx, k) {
      var base = 82, ch = cols[k % cols.length];
      x.fillStyle = '#6B3F1E'; x.fillRect(tx, base - 6, 2, 6);
      x.fillStyle = ch; x.fillRect(tx - 4, base - 14, 10, 7); x.fillRect(tx - 2, base - 17, 6, 3); x.fillRect(tx - 3, base - 7, 8, 1);
      x.fillStyle = '#2B1D12'; x.fillRect(tx - 4, base - 14, 1, 7); x.fillRect(tx + 5, base - 14, 1, 7);
    });
    // saplings in the middle (today's planting)
    for (var s = 0; s < 4; s++) { var sx = 56 + s * 10; x.fillStyle = '#6B3F1E'; x.fillRect(sx, 84, 1, 4); x.fillStyle = '#2F7D32'; x.fillRect(sx - 1, 82, 3, 2); x.fillStyle = '#8B5A2B'; x.fillRect(sx - 2, 88, 5, 1); }
  }

  // ===== 렌더 =====

    if (document.activeElement !== $('pname')) $('pname').value = S.name || '';
    if (document.activeElement !== $('pfamily')) $('pfamily').value = S.family || '';

    $('doneCount').textContent = dc;

    $('bar').innerHTML = MISSIONS.map(function (m, i) { return '<i class="' + (i < dc ? 'on' : '') + '"></i>'; }).join('');

    $('board').innerHTML = MISSIONS.map(function (m, i) {

  // 첫 저장 때 서버가 참가 기록도 함께 만들어요. 실패하면 자동으로 다시 시도해요.
  var flushing = false, retryTimer = null, waiters = {}, syncMsg = '', syncBad = false;
  function enqueue(mid, ans, photo, wasDone) {
    var k = Date.now() + '-' + mid + '-' + Math.random().toString(36).slice(2, 6);
    var inflight = flushing && S.pending[0] ? S.pending[0].k : null;
    S.pending = S.pending.filter(function (j) { return j.mid !== mid || j.k === inflight; });

      S.pending = S.pending.filter(function (j) { return j.k !== job.k; });

      else { syncBad = true; syncMsg = '미션 ' + ('0' + job.mid).slice(-2) + '을 저장하지 못했어요. ' + errMsg(e).replace(/^저장하지 못했어요\.\s*/, ''); renderSync(); }

  }
  function renderSync() {
    var el = $('syncState'); if (!el) return;

          var cur = ta.value.trim();
          if (cur.indexOf(word) < 0) ta.value = cur ? cur + ', ' + word : word;
          b.classList.add('on'); ta.focus();
        });
      });
      var rbox = sheet.querySelector('.review-box');
      if (rbox) rbox.addEventListener('input', function () {
        var st = reviewStat(rbox.value), c = $('m-count');
        c.textContent = st.lines + '줄 · ' + st.chars + '자'; c.classList.toggle('ok', st.ok);
      });
      var photoData = a.photo || null;
      var fi = $('m-photo');
      if (fi) fi.addEventListener('change', function () {
        var f = fi.files && fi.files[0]; if (!f) return;
        shrink(f, function (url) {
          if (!url) { var e2 = $('m-err'); if (e2) e2.textContent = '이 사진은 열 수 없어요. 다시 찍어 주세요.'; return; }
          photoData = url;
          var old = $('m-prev') || $('m-prev-wrap');
          var img = document.createElement('img'); img.id = 'm-prev'; img.alt = '내가 찍은 사진'; img.src = url;
          old.replaceWith(img);
        });
      });
      var go = $('m-go'); if (!go) return;
      go.addEventListener('click', function () {
        var err = $('m-err'); err.textContent = '';
        var v = $('m-ans') ? $('m-ans').value.trim() : '';
        if (m.kind === 'photo') {
          if (!photoData) { err.textContent = '사진을 먼저 찍어 주세요.'; return; }
          complete(m, { photo: photoData });
        } else if (m.kind === 'quiz') {
          var fb = $('m-fb');
          if (!v) { fb.className = 'feedback bad'; fb.textContent = '정답을 적어 주세요.'; return; }
          var ok = !m.answer || m.answer.some(function (x) { return norm(x) === norm(v); });
          if (!ok) {
            fb.className = 'feedback bad'; fb.textContent = '땡! 다시 도전해 봐요';
            var row = sheet.querySelector('.answer-row'); row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
            return;
          }
          fb.className = 'feedback good'; fb.textContent = '딩동댕! 정답이에요';
          go.disabled = true;
          setTimeout(function () { complete(m, { text: v }); }, 650);
        } else if (m.kind === 'trees') {
          var v2 = $('m-ans2').value.trim();
          if (!/^\d+$/.test(v) || +v < 1) { err.textContent = '심은 나무 수를 숫자로 적어 주세요.'; return; }
          if (!v2) { err.textContent = '나무에게 이름을 지어 주세요.'; return; }
          complete(m, { text: v, text2: v2 });
        } else if (m.kind === 'choice') {
          var pick = sheet.querySelector('input[name="m-choice"]:checked');
          if (!pick) { err.textContent = '하나를 골라 주세요.'; return; }
          complete(m, { text: pick.value });
        } else if (m.kind === 'review') {
          if (!reviewStat(v).ok) { err.textContent = '조금만 더 적어 주세요. 3줄 이상(또는 ' + REVIEW_MIN_CHARS + '자 이상)이면 돼요.'; return; }
          complete(m, { text: v });
        } else {
          if (!v) { err.textContent = '한 글자라도 적어 주세요.'; return; }
          complete(m, { text: v });
        }
      });
    });
  }

  function shrink(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 520, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { cb(c.toDataURL('image/jpeg', 0.72)); } catch (e) { cb(r.result); }
      };
      img.onerror = function () { cb(null); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

  function complete(m, ans) {
    var before = lineInfo().count, wasAll = doneCount() === 9;
    var go = $('m-go');
    if (m.kind === 'photo') {
      // 사진은 드라이브에 올라간 걸 확인한 뒤 완료로 바꿔요
      if (go) go.disabled = true;
      busy(true, '사진 올리는 중...');
      var k = enqueue(m.id, ans, true, !!S.done[m.id]);
      new Promise(function (resolve, reject) { waiters[k] = { resolve: resolve, reject: reject }; flush(); }).then(function () {
        busy(false);
        S.answers[m.id] = ans; S.done[m.id] = true; save();
        closeSheet(); render(); celebrate(m, before, wasAll);
      }).catch(function (e) {
        busy(false);
        if (go) go.disabled = false;
        var err = $('m-err'); if (err) err.textContent = errMsg(e);
      });
      return;
    }
    // 글·선택 미션은 바로 완료
    var wasDone = !!S.done[m.id];
    S.answers[m.id] = ans; S.done[m.id] = true;
    enqueue(m.id, ans, false, wasDone);
    closeSheet(); render(); celebrate(m, before, wasAll);
    flush();
  }
  function celebrate(m, before, wasAll) {
    var t = document.querySelector('.tile[data-i="' + (m.id - 1) + '"]'); if (t) t.classList.add('pop');
    var li = lineInfo();
    if (doneCount() === 9 && !wasAll) { toast('ALL CLEAR! 올빙고'); confetti(60); }
    else if (li.count > before) { toast('BINGO! ' + li.count + '줄 완성'); confetti(36); }
    else toast('MISSION CLEAR');
  }

  function toast(msg) {
    var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
    $('toastHost').appendChild(el); setTimeout(function () { el.remove(); }, 1700);
  }
  function confetti(n) {
    var box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
    var cs = ['#FFD23F', '#E0581F', '#5DBB4A', '#2F62C9', '#E5484D', '#FFFFFF'];
    for (var i = 0; i < n; i++) {
      var p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%'; p.style.background = cs[i % cs.length];
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      box.appendChild(p);
    }
    document.body.appendChild(box); setTimeout(function () { box.remove(); }, 2200);
  }

  // ===== 선물 교환 =====
  $('giftBtn').addEventListener('click', function () {
    var li = lineInfo(), dc = doneCount();
    if (dc < 9 || S.gift) return;
    if (S.pending.length) { flush(); toast('저장 중이에요. 잠시만요'); return; }
    var tierName = '9칸 올빙고 선물';
    var who = S.name;
    openSheet(
      '<div class="sheet-top"><div><span class="pixel-label">GIFT COUNTER</span><h3>선물 교환</h3></div><button class="close" type="button" data-close aria-label="닫기">X</button></div>' +
      '<div class="ticket"><span class="pixel-label">' + (S.family ? 'FAMILY' : 'SOLO') + '</span><span class="big">' + esc(who) + '</span>' +
      (S.family ? '<span>자녀 ' + esc(S.family) + '</span>' : '') +
      '<div class="row"><span class="chip">LINES <b>' + li.count + '</b></span><span class="chip">CLEAR <b>' + dc + '/9</b></span></div>' +
      '<strong style="font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--leaf)">' + tierName + '</strong></div>' +
      '<div class="staff"><span class="pixel-label">STAFF ONLY</span><label for="g-pin">사회공헌팀 스태프 비밀번호</label>' +
      '<input class="input pin" id="g-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">' +
      '<p class="error" id="g-err"></p><button type="button" class="btn blue block" id="g-go">선물 지급 완료</button></div>',
      function () {
        $('g-go').addEventListener('click', function () {
          var err = $('g-err'); err.textContent = '';
          var pin = $('g-pin').value.trim();
          if (!pin) { err.textContent = '스태프가 비밀번호를 입력해 주세요.'; return; }
          var btn = $('g-go'); btn.disabled = true;
          busy(true, '확인 중...');
          call('redeem', S.id, pin).then(function (res) {
            busy(false); btn.disabled = false;
            if (!res || !res.ok) {
              var code = res && res.error;
              if (res && res.state) { applyServer(res.state); render(); }
              err.textContent = code === 'pin' ? '비밀번호가 맞지 않아요. 스태프가 입력해 주세요.'
                : code === 'already' ? '이미 선물을 받은 기록이 있어요.'
                : code === 'notready' ? '아직 9칸을 모두 채우지 않았어요.'
                : '참가 기록을 찾을 수 없어요. 스태프에게 알려 주세요.';
              return;
            }
            applyServer(res.state); render();
            showDone(res.at);
          }).catch(function (e) { busy(false); btn.disabled = false; err.textContent = errMsg(e); });
        });
      }
    );
    function showDone(now) {
          openSheet(
            '<div class="sheet-top"><div><span class="pixel-label">GIFT COUNTER</span><h3>교환 완료</h3></div><button class="close" type="button" data-close aria-label="닫기">X</button></div>' +
            '<div class="ticket"><span class="big">' + esc(who) + '</span><span class="done-stamp">지급 완료 ' + timeStr(now) + '</span>' +
            '<strong style="font-family: var(--f-display); font-weight: 400; font-size: 20px">' + tierName + '</strong>' +
            '<p class="note" style="margin: 0">숲을 지켜 줘서 고마워요!</p></div>' +
            '<button type="button" class="btn green block" data-close>보드로 돌아가기</button>',
            function (sh) { sh.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeSheet); }); }
          );
          confetti(60);
    }
  });

  drawScene();
  render();
  // 다시 들어왔을 때 시트 기록과 맞추기 (선물 지급 여부 등)
  if (S.id) {
    call('getState', S.id).then(function (st) { if (st) { applyServer(st); render(); } }).catch(function () {});
  }
  flush();   // 닫기 전에 남은 저장이 있으면 이어서 저장
})();
</script>
</body>
</html>
